<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قِسمة — إدارة الوحدات السكنية</title>
<meta name="theme-color" content="#0C3733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="قِسمة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230C3733'/><text x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif'>ق</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#08221F;--deep:#0C3733;--teal:#164F47;--paper:#E9EDEA;--card:#fff;--line:#D3DCD9;
--brass:#A8802C;--moss:#3D8A76;--clay:#A34A3B;--muted:#6E817D;--r:10px}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
.shell,.main,.body{min-width:0;max-width:100%}
body[data-theme="dark"]{
 --ink:#E2EBE8;--deep:#0A2521;--teal:#1A5C53;--paper:#0D1917;--card:#152522;
 --line:#264039;--brass:#D2A852;--moss:#54AE93;--clay:#D4776A;--muted:#8CA39E}
body[data-theme="dark"] .day{background:#1A2A27;border-color:#264039;color:#5F7671}
body[data-theme="dark"] .note{background:#241F14;border-color:#453A20;color:#E2DCC8}
body[data-theme="dark"] .warn{background:#2A1A18;border-color:#4A2A26}
body[data-theme="dark"] .step.done{background:#12332B;border-color:#2A5C4C;color:#7FCFB4}
body[data-theme="dark"] tbody tr:hover td{background:#1B2B28}
body[data-theme="dark"] td{border-bottom-color:#1E312C}
body[data-theme="dark"] .sheet footer{background:#111E1B}
body[data-theme="dark"] .dup{background:#2E1A18;border-color:#4A2A26}
body[data-theme="dark"] .sum td{border-bottom-color:#1E312C}
body[data-theme="dark"] .f input,body[data-theme="dark"] .f select,body[data-theme="dark"] .f textarea,
body[data-theme="dark"] input,body[data-theme="dark"] select{background:#1A2A27;color:var(--ink)}
body[data-theme="dark"] .brand h1{color:#fff}
body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;-webkit-text-size-adjust:100%}
.kufi{font-family:'Noto Kufi Arabic','IBM Plex Sans Arabic',sans-serif;letter-spacing:-.01em}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}
a{color:var(--teal)}

.shell{display:flex;min-height:100vh}
.nav{width:206px;flex:0 0 206px;background:var(--deep);color:#DCE7E4;display:flex;flex-direction:column;
padding:20px 12px;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:2px 10px 20px}
.brand h1{margin:0;font-size:26px;font-weight:700;color:#fff;line-height:1}
.brand p{margin:6px 0 0;font-size:10.5px;color:#7FA49D;letter-spacing:.04em}
.nb{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;font-size:13.5px;
color:#B4CBC6;width:100%;text-align:right;transition:.15s}
.nb:hover{background:#12433D;color:#fff}
.nb.on{background:var(--teal);color:#fff}
.nb svg{flex:0 0 auto}
.navgrp{font-size:9.5px;color:#6C918B;letter-spacing:.12em;padding:14px 12px 5px;font-weight:600}
.nav .navgrp:first-of-type{padding-top:2px}
.navfoot{margin-top:auto;padding:12px 10px 0;border-top:1px solid #17453F;font-size:10.5px;color:#6C918B;line-height:1.7}

.main{flex:1;min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:13px 24px;display:flex;
align-items:center;gap:11px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h2{margin:0;font-size:18px;font-weight:700}
.top .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.body{padding:22px 24px 40px;max-width:1280px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:17px}
.h3{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0 0 13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
.kpi .lab{font-size:11px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:23px;font-weight:600;line-height:1}
.kpi .cur{font-size:11px;color:var(--muted);margin-inline-start:4px}

.split{display:flex;height:32px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.split>div{display:flex;align-items:center;justify-content:center;min-width:0;font-size:10.5px;color:#fff}
.mini{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--paper)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-inline-end:5px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-size:11px;font-weight:600;color:var(--muted);padding:9px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 9px;border-bottom:1px solid #EDF1EF;white-space:nowrap}
tbody tr:hover td{background:#F6F9F7}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:var(--paper);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:500;transition:.15s}
.btn-p{background:var(--deep);color:#fff}.btn-p:hover{background:var(--teal)}
.btn-g{background:var(--card);border:1px solid var(--line)}.btn-g:hover{background:var(--paper)}
.btn-d{color:var(--clay)}
.ico{padding:6px;border-radius:6px;color:var(--muted);display:inline-flex}
.ico:hover{background:var(--paper);color:var(--ink)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 11px}

.dlg{position:fixed;inset:0;background:rgba(8,34,31,.72);display:flex;align-items:center;
justify-content:center;padding:22px;z-index:200}
.dlg-b{background:var(--card);border-radius:14px;max-width:420px;width:100%;padding:22px;
box-shadow:0 18px 48px rgba(8,34,31,.3)}
.dlg-b p{margin:0 0 18px;font-size:14.5px;line-height:1.9}
.dlg-b .row{display:flex;gap:9px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(8,34,31,.55);display:flex;align-items:flex-start;
justify-content:center;padding:22px 14px;z-index:60;overflow-y:auto}
.sheet{background:var(--card);border-radius:14px;width:100%;max-width:640px}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 19px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:17px;font-weight:700}
.sheet .bd{padding:19px}
.sheet footer{display:flex;gap:9px;padding:14px 19px;border-top:1px solid var(--line);background:#FAFCFB;border-radius:0 0 14px 14px}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px}
.rule{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #E4EAE8}
.rule:last-child{border-bottom:none}
.qact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.todo{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
 text-align:right;transition:.15s;width:100%}
.todo:hover{border-color:var(--brass);background:var(--paper)}
.todo .lab{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.todo .val{font-size:18px;font-weight:700}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.note{background:#FBF7EC;border:1px solid #E8DCBE;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.85}
.warn{background:#FDF4F2;border:1px solid #E8C4BC;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.85}

.cal{display:grid;gap:2px}
.crow{display:grid;gap:2px;align-items:center}
.day{height:25px;border-radius:3px;background:#F0F3F1;border:1px solid #E4EAE8;font-size:9px;
display:flex;align-items:center;justify-content:center;color:#98A8A4}
.dnum{font-size:9px;color:var(--muted);text-align:center;height:14px}
.turn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px}
.turn .dt{width:50px;flex:0 0 50px;text-align:center}
.turn .dt b{display:block;font-size:17px;line-height:1}
.turn .dt span{font-size:10px;color:var(--muted)}

.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{font-size:9.5px;color:var(--muted);text-align:center;padding-bottom:4px}
.dc{height:34px;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center;
font-family:'IBM Plex Mono',monospace}
.dc:hover{background:var(--paper)}
.dc.in{background:#DDE9E6;border-radius:0}
.dc.edge{background:var(--deep);color:#fff}

.step{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:12.5px;
border:1px solid var(--line);background:var(--card);text-align:right;width:100%}
.step.done{background:#EDF6F2;border-color:#BEDCD2;color:#2A6B5A}
.step .amt{margin-inline-start:auto;font-family:'IBM Plex Mono',monospace;font-size:12px}
.bk{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;background:var(--card)}
.prog{height:5px;border-radius:3px;background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;background:var(--moss)}
.tab{padding:8px 14px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--deep);color:#fff;border-color:var(--deep)}

.stmt{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;direction:rtl}
.stmt-hd{background:var(--deep);color:#fff;padding:22px 24px}
.stmt-hd .mk{font-size:10px;color:#8FB3AC;letter-spacing:.18em;margin-bottom:9px}
.stmt-hd h3{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.stmt-hd .hd-meta{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:14px;
 padding-top:13px;border-top:1px solid rgba(255,255,255,.16);font-size:12.5px;color:#C6DAD5}
.stmt-hd .hd-meta b{color:#8FB3AC;font-weight:500;margin-inline-end:6px}
.stmt-body{padding:0}
.stmt .cur{font-size:10.5px;color:var(--muted);margin-inline-start:3px}
.sum .subnote{font-size:10.5px;color:var(--muted);font-weight:400;margin-top:4px;line-height:1.6}
.stmt .neg{color:var(--clay)}
.stmt .pos{color:var(--moss)}

.sum{width:100%;border-collapse:collapse;table-layout:fixed}
.sum td{padding:12px 24px;font-size:14px;border-bottom:1px solid #EEF2F0;text-align:right}
.sum td.v{text-align:left;white-space:nowrap;width:44%}
.sum tr.tot td{background:var(--paper);font-weight:700;font-size:17px;
 border-top:2px solid var(--deep);border-bottom:none;padding-top:15px;padding-bottom:15px}
.sum tr.paid td{background:#EDF6F2;color:#2A6B5A;font-weight:600;font-size:13.5px;border-bottom:none}
.sum tr.paid .neg{color:#2A6B5A}
.sum tr.rem td{background:var(--paper);font-weight:700;font-size:15px;border-bottom:none;
 border-top:1px dashed var(--line)}

.stmt h4.sec{margin:26px 24px 11px;font-size:13px;font-weight:700;color:var(--deep);
 padding-bottom:8px;border-bottom:2px solid var(--paper)}
.stmt h4.sec .note-in{font-weight:400;font-size:11px;color:var(--muted);margin-inline-start:8px}
.stmt .scroll{padding:0 24px}
table.det{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.det th{background:var(--paper);color:var(--deep);font-size:10.5px;font-weight:700;
 padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.det td{padding:10px;border-bottom:1px solid #F0F4F2;text-align:right;vertical-align:top;white-space:nowrap}
table.det th.e,table.det td.e{text-align:left}
table.det th.c,table.det td.c{text-align:center}
table.det td.wrap{white-space:normal;line-height:1.6;word-break:break-word}
table.det td{overflow-wrap:break-word}
table.det col.w-per{width:22%}
table.det col.w-plat{width:12%}
table.det col.w-n{width:7%}
table.det col.w-m{width:13%}
table.det col.w-st{width:11%}
table.det td.b{font-weight:700}
table.det .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
table.det .ar{color:var(--muted);font-size:10px;margin:0 2px}
table.det tr.ttl td{background:var(--paper);font-weight:700;font-size:12.5px;
 border-top:2px solid var(--deep);border-bottom:none}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.pill.ok{background:#EDF6F2;color:#2A6B5A}
.pill.no{background:#FBEDEA;color:var(--clay)}
.pill.cash{background:#FBF7EC;color:#8A6A20}
.stmt-foot{margin:24px;padding-top:14px;border-top:1px solid var(--line);
 font-size:11px;color:var(--muted);line-height:1.85}
.stmt .empty{padding:44px 24px}
.sv{font-size:11.5px;display:flex;align-items:center;gap:5px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
 border:1px solid var(--brass);color:var(--brass);font-size:10.5px;font-weight:700;margin-inline-start:5px;vertical-align:1px;
 font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1;padding:0;cursor:pointer}
.tip:hover{background:var(--brass);color:#fff}
.guide details{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:9px}
.guide summary{padding:13px 16px;font-size:14.5px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:'▾';margin-inline-start:auto;color:var(--muted);font-size:12px}
.guide details[open] summary::after{content:'▴'}
.guide .gb{padding:0 16px 14px;font-size:13.5px;line-height:1.95}
.guide .gb ol,.guide .gb ul{margin:4px 0 8px;padding-inline-start:20px}
.guide .gb li{margin-bottom:5px}
.guide .gb b{color:var(--deep)}
body[data-theme="dark"] .guide .gb b{color:var(--ink)}
.guide .ex{background:var(--paper);border-radius:8px;padding:9px 12px;margin:6px 0 9px;font-size:12.5px}
.steps-w{display:grid;gap:8px;margin:16px auto 0;max-width:440px;text-align:right}
.steps-w button{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13.5px;width:100%;text-align:right}
.steps-w button.done{background:#EDF6F2;border-color:#BEDCD2;color:#2A6B5A}
body[data-theme="dark"] .steps-w button.done{background:#12332B;border-color:#2A5C4C;color:#7FCFB4}
.steps-w .n{width:24px;height:24px;border-radius:50%;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.steps-w .done .n{background:var(--moss);color:#fff}
.sv b{font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:520px){
 .kpi .val{font-size:20px}
 .kpi .lab{font-size:10.5px}
 .kpi{padding:12px 12px}
 .top h2{font-size:16px}
 .top .sub{font-size:10.5px}
 .top{gap:8px;padding:10px 12px}
 .body{padding:12px 11px 30px}
 .btn{padding:8px 12px;font-size:12.5px}
 .tab{padding:7px 12px;font-size:12.5px}
 th,td{padding:8px 7px;font-size:12px}
 .sheet .bd{padding:15px}
 .g2,.g3{grid-template-columns:1fr}
 .modal{padding:12px 8px}
 .sum td{padding:10px 14px;font-size:13px}
 .stmt-hd{padding:16px 15px}
 .stmt-hd h3{font-size:19px}
 .dlg{padding:12px}
 .dlg-b{padding:17px}
 .split{height:30px}
 .nb{min-width:52px;font-size:9px}
}
@media(max-width:860px){
 .shell{flex-direction:column}
 .nav{position:fixed;bottom:0;top:auto;width:100%;flex:none;height:auto;flex-direction:row;
  padding:6px 4px;gap:2px;z-index:50;border-top:1px solid #17453F;overflow-x:auto;
  padding-bottom:calc(6px + env(safe-area-inset-bottom))}
 .brand,.navfoot,.navgrp{display:none}
 .nb{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 3px;justify-content:center;flex:0 0 auto;min-width:58px}
 .main{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
 .body{padding:14px 13px 30px}.top{padding:11px 13px}
 .kpis{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}
}
@media print{
 .nav,.top,.noprint{display:none!important}
 html,body{background:#fff;direction:rtl}
 .body{padding:0;max-width:none}
 .stmt{border:none;direction:rtl}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .stmt-hd{background:#0C3733!important;color:#fff!important}
 .stmt .scroll{overflow:visible!important;padding:0 10mm;max-width:100%}
 table.det{width:100%!important;table-layout:fixed!important;word-break:break-word}
 table.det td,table.det th{white-space:normal!important;padding:7px 5px}
 table.det td.num,table.det th.e,table.det td.e{white-space:nowrap!important}
 .wrap{max-width:100%!important}
 .sum td{padding-inline:12mm}
 .stmt h4.sec{margin-inline:12mm}
 .stmt-foot{margin-inline:12mm}
 table.det{font-size:9.5pt}
 table.det tr,tr.ttl,.sum tr{break-inside:avoid;page-break-inside:avoid}
 thead{display:table-header-group}
 h4.sec{break-after:avoid;page-break-after:avoid}
 .card{break-inside:avoid}
 @page{margin:12mm}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* ══════════════════════ helpers ══════════════════════ */
const $ = (s,r)=> (r||document).querySelector(s);
const E = (s)=> s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => (v===''||v==null||isNaN(Number(v)))?0:Number(v);
const fmt=(v,d)=>new Intl.NumberFormat('en-US',{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?2:d})
  .format(Math.round(n(v)*100)/100);
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthOf=d=>d?String(d).slice(0,7):'';
// فحص الحجز: يرجّع قائمة مشاكل [{lvl:'err'|'warn', msg}]
function checkBooking(b,all){
 const P=[];
 if(!b) return P;
 const net=netOf(b), nt=nights(b);
 if(!b.unitId) P.push({lvl:'err',msg:'ما فيه وحدة محددة'});

const EPS=0.004;   // عتبة التقريب — بديل الرقم السحري .004
let _fxCache={};

let _calcCache=new Map(), _unitCache=null, _unitSrc=null, _calcSrc=null;
function clearCaches(){ _fxCache={}; _calcCache=new Map(); _unitCache=null; _unitSrc=null; _calcSrc=null; }

// تصفير) ينتج مصفوفة جديدة فيُعاد بناء الكاش تلقائياً — لا كائنات قديمة أبداً.
function unitOf(id){
 const src=(S&&S.units)||null;
 if(!_unitCache||_unitSrc!==src){
  _unitCache=new Map(); _unitSrc=src;
  (src||[]).forEach(u=>_unitCache.set(u.id,u));
 }

}

function R(b){

 if(_calcSrc!==src){ _calcCache=new Map(); _calcSrc=src; }

 if(!k) return calc(b,unitOf(b.unitId));   // كائن مؤقت (نموذج قيد التحرير) — لا يُخزَّن
 const hit=_calcCache.get(k);
 if(hit&&hit.__b===b) return hit;          // نفس الكائن بالضبط، وإلا نعيد الحساب
 const v=calc(b,unitOf(b.unitId));
 try{ Object.defineProperty(v,'__b',{value:b,enumerable:false}); }catch(e){}
 _calcCache.set(k,v);

}

/* ══════════════════════ الشركاء (Partners) ══════════════════════
كل شريك له «اتفاقات» — اتفاق لكل وحدة بفترة سريان (من شهر / إلى شهر). الحجز ينحسب على الاتفاق
الساري في شهر دخوله، فتغيير الشروط أو إنهاء الشراكة من شهر معيّن ما يمس الحجوزات اللي قبله.
أساس الحصة: mgmt صافي الإدارة · mynet صافي ربحي الكامل · own نصيب ملكيتي · fee رسوم الإدارة قبل الخصومات · inc إجمالي الدخل

محمد (p_moh) ينتقل من حقول الوحدة القديمة (mohPct/mohBase) إلى اتفاقات «من البداية» بنفس النسب — والحسابات تطلع نفسها بالضبط.

 const v=n(c.amount)+claimFx(c);

 return t==='owner'?v:t==='shared'?v*(1-n(u?u.myOwnPct:0)):0;
};
const claimMyCut=(c,u)=>{
 const v=n(c.amount)+claimFx(c);
 const t=claimTo(c);
 return t==='mgr'?v:t==='shared'?v*n(u?u.myOwnPct:0):0;
};
const ownerCut=(e,u)=>e.chargeTo==='owner'?n(e.amount):e.chargeTo==='shared'?n(e.amount)*(1-n(u?u.myOwnPct:0)):0;
const myCut=(e,u)=>e.chargeTo==='mgr'?n(e.amount):e.chargeTo==='shared'?n(e.amount)*n(u?u.myOwnPct:0):0;
function steps(b,u){
 if(!u) return [];
 const r=calc(b,u), s=[{k:'in',l:'وصل المبلغ لحسابي',v:r.base}];
 if(commDue(b)>0) s.push({k:'comm',l:'عمولة '+b.platform+' (شامل الضريبة)',v:commDue(b)});
 if(r.clean>0) s.push({k:'clean',l:'حوالة النظافة',v:r.clean});
 if(r.laundry>0) s.push({k:'laundry',l:'حوالة المغسلة',v:r.laundry});
 if(r.maint>0) s.push({k:'maint',l:'صيانة',v:r.maint});
 if(r.supplies>0) s.push({k:'sup',l:'مستلزمات',v:r.supplies});
 if(cashBy(b)==='owner'){
  const back=cashTaken(b,u)-r.ownerNet;   // كل ما بيده ناقص نصيبه = عمولة + إدارة + خصومات
  if(back>.004) s.push({k:'owner',l:'يحوّل لي '+(u.owner||'المالك')+' — استلم كاش',v:back});
 } else if(r.ownerNet>.004) s.push({k:'owner',l:'تحويل '+(u.owner||'المالك'),v:r.ownerNet});
 ptOrder(r.parts).forEach(function(pid){ const v=n((r.parts||{})[pid]);
  if(v>.004) s.push({k:ptKey(pid),l:'حصة '+ptName(pid),v:v}); });
 if(r.myNet>.004) s.push({k:'mine',l:'حصتي',v:r.myNet});
 const back=n(b.deposit)-n(b.depositKept);
 if(back>.004) s.push({k:'dep',l:'إرجاع التأمين للضيف',v:back});
 return s;
}
const VAT=0.15;
// العمولة الفعلية المدفوعة = المكتوبة + ضريبة القيمة المضافة (لبوكنق)
// حجوزات بوكنق: صافي التحويل = سعر الضيف − العمولة شاملة الضريبة
// يسري فقط على الحجوزات الجديدة (المعلَّمة autoNet) حتى لا تتغيّر الأرقام التاريخية
const autoNet=b=>!!b&&b.autoNet===true&&b.platform==='Booking'&&n(b.gross)>0;
function netOf(b){
 if(autoNet(b)) return Math.round((n(b.gross)-commDue(b))*100)/100;
 return n(b.net);
}
function commDue(b){
 const c=n(b.commission); if(c<=0) return 0;
 // الافتراضي للحجوزات القديمة: الرقم المسجَّل شامل الضريبة أصلاً (commVat غير محدد)
 return Math.round((((b.commVat===true)?c*(1+VAT):c))*100)/100;
}
// من استلم الكاش: '' = ما فيه كاش | owner | me | moh | staff
const CASHPLAT=['Booking','Google'];
const cashOk=b=>!!b&&CASHPLAT.indexOf(b.platform)>=0;
const cashBy=b=>(b&&b.cashBy&&cashOk(b))?b.cashBy:'';
// المبلغ الكامل اللي استلمه صاحب الكاش من الضيف = سعر الضيف إن وُجد، وإلا الصافي + العمولة
function cashTaken(b,u){
 if(!cashBy(b)) return 0;
 const g=n(b.gross);
 return g>0 ? g : (netOf(b)+effFx(b,u)+commDue(b));
}
function cashLabel(b,u){
 const k=cashBy(b);
 if(k==='owner') return (u&&u.owner)?u.owner:'المالك';
 if(k==='me') return 'أنا';
 if(k==='moh') return partnerById(PT_LEGACY)?ptName(PT_LEGACY):'محمد';
 if(String(k).indexOf('pt:')===0) return ptName(String(k).slice(3));
 if(k==='staff') return b.cashWho?b.cashWho:'عامل';
 return '';
}
const AUTOPAID=['Gathern'];
function autoIn(b){
 if(cashBy(b)) return true;              // الكاش وصل يد أحدهم فعلاً
 if(AUTOPAID.indexOf(b.platform)>=0) return true;
 if(viaPP(b)) return !!batchFor(b);
 return false;
}
// نقية: تعتمد على ما يُمرَّر لها فقط — قابلة للاختبار المعزول
function isDoneIn(b,k,transfers){
 const tr=(transfers||{})[b.id]||{};
 if(k==='in' && tr.in===undefined) return autoIn(b);
 return !!tr[k];
}
function isDone(b,k){ return isDoneIn(b,k,S.transfers); }
const depHeld=b=>{const back=n(b.deposit)-n(b.depositKept);
 return (back>.004&&!isDone(b,'dep'))?back:0;};

/* ── الإيراد حسب الليلة ──
الحجوزات اللي دخولها من بداية الدفتر (inLedger) تتوزع على أشهر لياليها بالتناسب (فندقياً).
الحجوزات قبلها تبقى كاملة في شهر الدخول — بدون أي تغيير على الأرقام القديمة. */
function allocOf(b){
 if(!b||!b.checkin) return [];
 const nt=nights(b);
 if(!inLedger(b)||nt<=0) return [{m:monthOf(b.checkin),f:1,nt:nt}];
 const o={}; for(let i=0;i<nt;i++){ const m=monthOf(addD(b.checkin,i)); o[m]=(o[m]||0)+1; }
 return Object.keys(o).sort().map(m=>({m:m,f:o[m]/nt,nt:o[m]}));
}
function fracIn(b,from,to){
 if(!b||!b.checkin) return {f:0,nt:0};
 const nt=nights(b);
 if(!inLedger(b)||nt<=0){ const ok=(!from||b.checkin>=from)&&(!to||b.checkin<=to); return {f:ok?1:0,nt:ok?nt:0}; }
 let c=0; for(let i=0;i<nt;i++){ const d=addD(b.checkin,i); if((!from||d>=from)&&(!to||d<=to)) c++; }
 return {f:c/nt,nt:c};
}

function closeGroups(m){
 const live=liveB().filter(b=>monthOf(b.checkin)===m);
 const G=[];
 // مجموعة لكل مالك خارجي
 S.units.forEach(u=>{

  const back=live.filter(b=>b.unitId===u.id&&!isDone(b,'owner')&&cashBy(b)==='owner');

 });
 // حصة كل شريك — كل الوحدات مع بعض
 ptOrder({}).forEach(function(pid){ const k=ptKey(pid);

  if(L.length) G.push({k:k, step:k, label:'حصة '+ptName(pid), sub:'كل الوحدات',
   ids:L.map(b=>b.id), tot:L.reduce((a,b)=>a+n(R(b).parts[pid]),0)});
 });
 // حصتي
 const mine=live.filter(b=>!isDone(b,'mine')&&R(b).myNet>.004);
 if(mine.length) G.push({k:'mine', step:'mine', label:'حصتي', sub:'كل الوحدات',
  ids:mine.map(b=>b.id), tot:mine.reduce((a,b)=>a+R(b).myNet,0)});
 // النظافة والمغسلة والصيانة والمستلزمات
 [['clean','حوالة النظافة'],['laundry','حوالة المغسلة'],['maint','صيانة'],['sup','مستلزمات']].forEach(p=>{
  const l=live.filter(b=>{const st=steps(b,unitById(b.unitId)).filter(s=>s.k===p[0])[0];
   return st&&st.v>.004&&!isDone(b,p[0])});
  if(l.length) G.push({k:p[0], step:p[0], label:p[1], sub:'كل الوحدات', ids:l.map(b=>b.id),

 });

 const inn=live.filter(b=>!isDone(b,'in')&&R(b).base>.004);
 if(inn.length) G.push({k:'in', step:'in', label:'وصول المبالغ لحسابي', sub:'غير المؤكدة',

 // عمولات المنصات
 const cm=live.filter(b=>commDue(b)>0&&!isDone(b,'comm'));
 if(cm.length) G.push({k:'comm', step:'comm', label:'عمولات المنصات', sub:'شاملة الضريبة',

 // إرجاع التأمينات
 const dp=live.filter(b=>depHeld(b)>.004);
 if(dp.length) G.push({k:'dep', step:'dep', label:'إرجاع تأمينات للضيوف', sub:'أمانة',

 return G;

العقد يتقسّم لدفعات حسب طريقة الدفع (شهري / كل 3 / كل 6 / سنوي). كل دفعة تنحفظ كحجز عادي بمنصة «شهري»
فتمشي على نفس محرّك القسمة: إدارتك، نصيب المالك، حصص الشركاء حسب اتفاقاتهم، التحويلات، كشف المالك، الإقفال.
الدفعة: «قيد التحصيل» = مستحقة (أو متأخرة لو عدّى تاريخها) · «مُحصّل» = وصلت.
التأمين ينحط على آخر دفعة عشان تنبيه الإرجاع يطلع بنهاية العقد، مو بأول شهر. */

// دخول/خروج فعلي: للحجز اليومي دايماً، ولدفعات العقد بس أول دفعة (دخول) وآخر دفعة باقية (خروج)
function turnIn(b){ return !b.contractId||b.ctIdx===1; }
function turnOut(b){ if(!b.contractId) return true; const I=S.bookings.filter(x=>x.contractId===b.contractId&&x.status!=='ملغي');
 return !I.some(x=>x.checkin>b.checkin); }
// تاريخ + عدد شهور (اليوم يتقيّد بآخر الشهر: 31 يناير + شهر = 28/29 فبراير)
function addMonths(iso,k){
 const y=+iso.slice(0,4), m=+iso.slice(5,7)-1+k, d=+iso.slice(8,10);
 const Y=y+Math.floor(m/12), M=((m%12)+12)%12, last=new Date(Y,M+1,0).getDate();
 return Y+'-'+String(M+1).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0');
}

const ctOf=id=>(S.contracts||[]).filter(c=>c.id===id)[0];

// يولّد دفعات العقد — مبلغ كل دفعة = الإيجار الشهري × عدد شهورها
function ctBuild(c){
 const N=Math.ceil(n(c.months)/n(c.freq)), out=[], end=ctEnd(c);
 for(let i=0;i<N;i++){
  const from=addMonths(c.start,i*n(c.freq)), mths=Math.min(n(c.freq),n(c.months)-i*n(c.freq));
  const to=i===N-1?end:addMonths(c.start,(i+1)*n(c.freq));
  out.push({id:'ct_'+c.id+'_'+(i+1),contractId:c.id,ctIdx:i+1,ctN:N,unitId:c.unitId,apt:c.apt||'',platform:'شهري',ref:c.ejar||'',
   checkin:from,checkout:to,gross:'',commission:'',net:Math.round(n(c.rent)*mths*100)/100,fx:'',clean:0,laundry:0,
   deposit:i===N-1&&n(c.deposit)>0?n(c.deposit):'',depositKept:'',commVat:false,cashBy:'',cashWho:'',autoNet:false,
   status:'قيد التحصيل',notes:'إيجار شهري — '+(c.tenant||'')+' · دفعة '+(i+1)+' من '+N});
 }
 // عمولة السعي/المنصة تنخصم من أول دفعة
 if(out.length&&n(c.commission)>0){ out[0].net=Math.round((out[0].net-n(c.commission))*100)/100; out[0].notes+=' · بعد خصم عمولة '+fmt(c.commission,2); }
 return out;
}

  if(locked){ // تعديل غير مالي فقط
   S.contracts=S.contracts.map(c=>c.id===d.id?Object.assign({},c,{tenant:d.tenant,phone:d.phone,notes:d.notes,util:d.util}):c);
   S.bookings=S.bookings.map(b=>b.contractId===d.id?Object.assign({},b,{notes:String(b.notes||'').replace(/^إيجار شهري — [^·]*·/,'إيجار شهري — '+d.tenant+' ·')}):b);

  }

  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d.start||''))){ toast('حدد بداية العقد.'); return false; }
  if(!(d.months>=1&&d.months<=60)){ toast('المدة بين 1 و 60 شهر.'); return false; }
  if(!CT_FREQ[d.freq]){ toast('اختر طريقة الدفع.'); return false; }
  if(!(d.rent>0)){ toast('اكتب الإيجار الشهري.'); return false; }

  const cl=ctClash(d,d.id);
  if(cl.length){ const b=cl[0]; toast('الفترة تتداخل مع '+(b.contractId?'عقد':'حجز')+' '+b.checkin+' ← '+b.checkout+' في نفس '+(u&&n(u.rooms)>1?'الغرفة':'الوحدة')+'.'); return false; }
  if(!d.id) d.id=uid();
  const c={id:d.id,unitId:d.unitId,apt:d.apt||'',tenant:String(d.tenant).trim(),phone:d.phone||'',start:d.start,months:d.months,freq:d.freq,
   rent:d.rent,deposit:d.deposit,commission:d.commission,ejar:d.ejar||'',util:d.util||'tenant',notes:d.notes||'',created:old?old.created:today()};
  S.contracts=(S.contracts||[]).filter(x=>x.id!==c.id).concat([c]);
  S.bookings=S.bookings.filter(b=>b.contractId!==c.id).concat(ctBuild(c));
  ui.ctOpen=c.id;
  return true;
 }
 if(modal.t==='ce'){
  const c=ctOf(d.cid), dt=d.date;
  if(!c){ toast('ما لقيت العقد.'); return false; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dt||''))){ toast('حدد تاريخ الخروج.'); return false; }
  if(dt<=c.start||dt>=ctEnd(c)){ toast('التاريخ لازم يكون بعد بداية العقد وقبل نهايته ('+ctEnd(c)+').'); return false; }
  const I=ctInst(c.id), dep=n(c.deposit);
  let keep=[];
  I.forEach(function(b){
   if(b.checkin>=dt){ if(instPaid(b)) keep.push(b); return; }        // بعد الخروج: تنشال لو ما وصلت
   if(b.checkout>dt&&!instPaid(b)){                                   // يقع فيها التاريخ: تنقص بالتناسب
    const all=nights(b), kept=nights({checkin:b.checkin,checkout:dt});
    keep.push(Object.assign({},b,{checkout:dt,net:Math.round(n(b.net)*kept/all*100)/100,notes:b.notes+' · منتهية مبكراً ('+kept+' من '+all+' يوم)'}));
   } else keep.push(b);
  });
  keep=keep.map(b=>Object.assign({},b,{deposit:''}));
  if(dep>0&&keep.length) keep[keep.length-1].deposit=dep;
  const ids={}; keep.forEach(b=>ids[b.id]=1);
  S.bookings=S.bookings.filter(b=>b.contractId!==c.id).concat(keep);
  Object.keys(S.transfers||{}).forEach(id=>{ if(id.indexOf('ct_'+c.id+'_')===0&&!ids[id]) delete S.transfers[id]; });
  S.contracts=S.contracts.map(x=>x.id===c.id?Object.assign({},x,{endedOn:dt}):x);
  return true;
 }
 return true;
}

/* ══════════════════════ المصاريف المتكررة ══════════════════════
ثابتة (إنترنت، اشتراكات): تتسجّل تلقائياً كل شهر بمبلغها — بمعرّف ثابت للشهر فما تتكرر حتى لو فتحت من جهازين.
متغيّرة (كهرباء، مياه): ما نخمّن مبلغها — تطلع كتذكير «فاتورة مستحقة» لين تسجّلها بمبلغها الفعلي. */
const recId=(r,m)=>'rc_'+r.id+'_'+m;
function recMonths(r){
 const cur=today().slice(0,7), out=[]; if(!r.from||r.active===false) return out;
 let m=r.from; while(m<=cur){ out.push(m); const d=new Date(+m.slice(0,4),+m.slice(5,7),1); m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
 return out;
}
function recDate(r,m){ const dd=Math.min(Math.max(1,parseInt(r.day,10)||1),28); return m+'-'+String(dd).padStart(2,'0'); }
// يضيف الثابتة الناقصة — يرجّع عدد اللي انضاف
function recurGen(){
 const have={}; S.expenses.forEach(e=>{ have[e.id]=1; });
 let added=0;
 (S.recurring||[]).forEach(function(r){
  if(r.kind!=='fixed'||!(n(r.amount)>0)) return;
  recMonths(r).forEach(function(m){
   const id=recId(r,m); if(have[id]||isClosedM(m)||recDate(r,m)>today()) return;
   S.expenses.push({id:id,recurId:r.id,date:recDate(r,m),unitId:r.unitId,category:r.category,description:r.description||r.category,
    amount:n(r.amount),paidBy:r.paidBy||'أنا',chargeTo:r.chargeTo||'owner',collected:'غير محصّل'});
   have[id]=1; added++;
  });
 });
 return added;
}
function recurDue(){
 const have={}; S.expenses.forEach(e=>{ have[e.id]=1; });
 const out=[];
 (S.recurring||[]).forEach(function(r){ if(r.kind!=='variable') return;
  recMonths(r).forEach(function(m){ if(!have[recId(r,m)]&&!isClosedM(m)&&recDate(r,m)<=today()) out.push({r:r,m:m}); }); });
 return out;
}

مستحقات: حجز «قيد التحصيل» عدّى على خروجه أكثر من 14 يوم.
تأمينات: تأمين ما رجع للضيف بعد خروجه بأكثر من 3 أيام. */
const AGE_RECV=14, AGE_DEP=3;
function agingLists(){
 const t=today();
 const recv=liveB().filter(b=>b.status==='قيد التحصيل'&&b.checkout&&addD(b.checkout,AGE_RECV)<t)
  .map(b=>({b:b,d:daysBetween(b.checkout,t)-1})).sort((a,b)=>b.d-a.d);
 const dep=liveB().filter(b=>depHeld(b)>.004&&b.checkout&&addD(b.checkout,AGE_DEP)<t)
  .map(b=>({b:b,d:daysBetween(b.checkout,t)-1})).sort((a,b)=>b.d-a.d);
 return {recv:recv,dep:dep};
}

// وصف مختصر للاتفاق: «50% من صافي الإدارة + 20 ر.س/ليلة · يتحمّل 50% من مصروفاتي»
function agrText(g){
 const P=[];
 if(n(g.pct)) P.push(fmtPct(g.pct)+' من '+(PBASE[g.base]||PBASE.mynet));
 if(n(g.fixed)) P.push(fmt(g.fixed,2)+' ر.س/'+(g.fixedPer==='night'?'ليلة':'حجز'));
 let t=P.join(' + ')||'—';
 if(n(g.expPct)) t+=' · يتحمّل '+fmtPct(g.expPct)+' من مصروفاتي';
 return E(t);
}
const fmtPct=v=>(n(v)*100).toFixed(2).replace(/\.?0+$/,'')+'%';
const agrRange=g=>(g.from?mLabel(g.from):'من البداية')+' ← '+(g.to?mLabel(g.to):'مستمر');
function agrState(g){ const m=today().slice(0,7);
 if(g.to&&g.to<m) return ['منتهي','var(--muted)']; if(g.from&&g.from>m) return ['يبدأ لاحقاً','var(--brass)']; return ['ساري','var(--moss)']; }
// حساب الشريك الشهري: المستحق من الحجوزات (موزّع على الليالي) − نصيبه من المصروفات − المدفوع (علامة التحويل)
function ptAccount(pid){
 const k=ptKey(pid);
 const ms=monthsList().slice();
 S.expenses.forEach(e=>{ const m=monthOf(e.date); if(m&&ms.indexOf(m)<0) ms.push(m); });
 ms.sort().reverse();
 return ms.map(function(m){
  const inM=liveB().filter(b=>fracM(b,m).f>0);
  const sh=b=>n((R(b).parts||{})[pid])*fracM(b,m).f;
  const per=S.units.map(u=>inM.filter(b=>b.unitId===u.id).reduce((a,b)=>a+sh(b),0));
  const due=per.reduce((a,v)=>a+v,0);
  const exp=S.expenses.filter(e=>monthOf(e.date)===m).reduce((a,e)=>a+ptExpCut(e,pid),0);
  const paidL=inM.filter(b=>isDone(b,k)&&n((R(b).parts||{})[pid])!==0);
  const paid=paidL.reduce((a,b)=>a+sh(b),0);
  const cnt=paidL.length, nb=inM.filter(b=>n((R(b).parts||{})[pid])!==0).length;
  return {m,per,due,exp,paid,cnt,n:nb,bal:due-exp-paid};
 }).filter(x=>Math.abs(x.due)>EPS||Math.abs(x.paid)>EPS||Math.abs(x.exp)>EPS);
}
const prevMonth=m=>{ const d=new Date(+m.slice(0,4),+m.slice(5,7)-2,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
// يشغّل fn على نسخة مؤقتة من الاتفاقات — عشان نعرف أثر التعديل قبل ما نحفظه
function withAgr(arr,fn){ const keep=S.pagr; S.pagr=arr; clearCaches(); try{ return fn(); } finally{ S.pagr=keep; clearCaches(); } }
function partsNow(){ const o={}; S.bookings.forEach(function(b){ if(b.status==='ملغي') return; const u=unitById(b.unitId); if(!u) return;
  const r=calc(b,u); o[b.id]={p:r.parts||{},t:r.moh,mx:Math.max(0,r.mgrNet+r.myOwn)}; }); return o; }
// أثر استبدال الاتفاقات بـ next: كم حجز تتغيّر حصته، ومجموع الفرق، وكم حجز تصير حصص الشركاء فيه أكبر من ربحي
function agrImpact(next){
 const A=partsNow(), B=withAgr(next,partsNow);
 let changed=0, delta=0, over=0;
 Object.keys(B).forEach(function(id){ const a=A[id]||{p:{},t:0}, b=B[id];
  if(JSON.stringify(a.p)!==JSON.stringify(b.p)){ changed++; delta+=b.t-a.t; if(b.t>b.mx+.01&&b.t>.01) over++; } });
 return {changed:changed,delta:delta,over:over};
}
function agrOverlap(arr,g){
 return arr.filter(x=>x.id!==g.id&&x.partnerId===g.partnerId&&x.unitId===g.unitId&&
  (!x.to||!g.from||x.to>=g.from)&&(!g.to||!x.from||g.to>=x.from))[0];
}
// حفظ نوافذ الشركاء — يرجّع true لو انحفظ التعديل في S (والمتصل يكمل commit)
function savePartnerModal(d){

 delete d._gmBad;

 }
 if(modal.t==='pe'){

  const next=[];

   if(!g.to||g.to>m) next.push(Object.assign({},g,{to:m})); else next.push(g);
  });
  const imp=agrImpact(next);
  if(!modal.agrOk){ const keep=modal;
   dialog={msg:'إنهاء شراكة '+ptName(d.partnerId)+' بعد '+mLabel(m)+': '+(imp.changed?imp.changed+' حجز بعد هالشهر تنشال منها حصته (مجموع '+fmt(Math.abs(imp.delta),2)+' ر.س يرجع لربحك).':'ما فيه حجوزات مسجّلة بعد هالشهر تتأثر.')+
    ' الحجوزات اللي قبل ما تتغيّر. تكمل؟',ok:'نعم، أنهِ الشراكة',yes:function(){ modal=keep; modal.agrOk=true; render(); const bt=document.querySelector('[data-act="saveM"]'); if(bt&&bt.click) bt.click(); }};
   render(); return false; }
  S.pagr=next; return true;
 }
 if(modal.t==='g'){

  if(!d.unitId){ toast('اختر الوحدة.'); return false; }
  d.pct=n(d.pct); d.expPct=n(d.expPct); d.fixed=n(d.fixed); d.fixedPer=d.fixedPer==='night'?'night':'booking';
  if(!PBASE[d.base]) d.base='mgmt';
  if(d.pct<0||d.pct>1||d.expPct<0||d.expPct>1){ toast('النسب لازم تكون بين 0 و 100.'); return false; }
  if(d.fixed<0){ toast('المبلغ الثابت ما يكون بالسالب.'); return false; }
  if(!(d.pct>0)&&!(d.fixed>0)&&!(d.expPct>0)){ toast('حدّد نسبة أو مبلغ ثابت.'); return false; }
  d.from=d.from||''; d.to=d.to||'';
  if(d.from&&d.to&&d.to<d.from){ toast('«إلى شهر» قبل «من شهر».'); return false; }
  let next=agrsOf(S).slice();
  const rep=d._replaces;
  if(rep){
   const old=next.filter(g=>g.id===rep)[0];
   if(!old){ toast('ما لقيت الاتفاق الأصلي.'); return false; }
   if(!d.from){ toast('حدّد «من شهر» للشروط الجديدة.'); return false; }
   if(old.partnerId!==d.partnerId||old.unitId!==d.unitId){ toast('تغيير الشروط يكون لنفس الشريك ونفس الوحدة — لوحدة ثانية أضف اتفاق جديد.'); return false; }
   if(old.from&&d.from<=old.from){ toast('الشروط الجديدة لازم تبدأ بعد بداية الاتفاق الحالي ('+mLabel(old.from)+') — أو عدّل الاتفاق نفسه.'); return false; }
   next=next.map(g=>g.id===rep?Object.assign({},g,{to:prevMonth(d.from)}):g);
  }
  const clean=Object.assign({},d); delete clean._replaces;
  if(!clean.id) clean.id='ag_'+uid();
  const ov=agrOverlap(next,clean);
  if(ov){ toast('فيه اتفاق ثاني لنفس الشريك على نفس الوحدة في نفس الفترة ('+agrRange(ov)+'). عدّل فتراتهم ما تتداخل.'); return false; }
  next=d.id?next.map(g=>g.id===d.id?clean:g):next.concat([clean]);
  // حماية للحجوزات الجاية: مجموع نسب الشركاء المتداخلة على نفس الوحدة (من صافي الإدارة/صافي ربحي/نصيب ملكيتي) ما يتعدى 100%
  const pctSum=next.filter(g=>g.unitId===clean.unitId&&['mgmt','mynet','own'].indexOf(g.base)>=0&&
   (!g.to||!clean.from||g.to>=clean.from)&&(!clean.to||!g.from||clean.to>=g.from)).reduce((a,g)=>a+n(g.pct),0);
  if(pctSum>1+1e-9){ toast('ما ينحفظ: مجموع نسب الشركاء على هالوحدة في نفس الفترة يصير '+fmtPct(pctSum)+' — أكثر من 100% من ربحك.'); return false; }
  const imp=agrImpact(next);
  if(imp.over){ toast('ما ينحفظ: حصص الشركاء تصير أكبر من ربحك في '+imp.over+' حجز. راجع النسبة أو الأساس.'); return false; }
  // تعديل يغيّر حجوزات مسجّلة أصلاً: نوضّح الأثر قبل الحفظ
  if(d.id&&imp.changed&&!modal.agrOk){ const keep=modal;
   dialog={msg:'هالتعديل يغيّر حصة '+imp.changed+' حجز مسجّل (الفرق '+(imp.delta>0?'+':'−')+fmt(Math.abs(imp.delta),2)+' ر.س). '+
    'لو قصدك الشروط تتغيّر من شهر جديد بس، ارجع واستخدم «غيّر من شهر». تكمل التعديل على الحجوزات المسجّلة؟',ok:'نعم، عدّل',

   render(); return false; }
  S.pagr=next; return true;
 }

function repCtx(){
 const ms=monthsList(), defM=ms[0]||today().slice(0,7);
 const uid2=ui.repU||(S.units[0]&&S.units[0].id), from=ui.repF||(defM+'-01'), to=ui.repT||lastDay(defM);
 return {ms,defM,uid2,from,to,u:unitById(uid2)};
}
// ── جمع بيانات الكشف: منطق خالص، بدون HTML ──
// دخل المالك في الكشف = الدخل ناقص فرق العملة اللي يخص الإدارة بالكامل (fxMine)،
// فتتطابق السطور: الدخل − الإدارة − الخصومات − حصة الشريك = نصيب المالك بالضبط.
const ownBase=r=>r.base-n(r.fxMine);
/* ══════════════════════ دفتر حساب الملاك (Owner Ledger) ══════════════════════
من شهر بداية الدفتر (ledgerFrom) وطالع: المدفوع للمالك ينسجّل كحركات بمبالغ فعلية ثابتة —
ما تتغيّر لو تغيّرت الحسابات بعدين. الأشهر قبلها تبقى على طريقتها القديمة (علامات التحويل) بدون أي تغيير.
أنواع الحركات: pay تحويل للمالك (ينقص المستحق) · recv استلام من المالك (فرق كاش) · adjust تسوية (+/−) · opening رصيد افتتاحي */
const LEDGER_DEFAULT='2026-10';
const ledgerFrom=()=>(S&&S.ledgerFrom)||LEDGER_DEFAULT;
const inLedger=b=>!!b&&String(b.checkin||'')>=ledgerFrom()+'-01';
const TXK={pay:'تحويل للمالك',recv:'استلام من المالك',adjust:'تسوية',opening:'رصيد افتتاحي'};
// علامة «تحويل المالك» على حجز في فترة الدفتر = حركة فعلية بالمبلغ وقت التعليم. فك العلامة يشيل الحركة التلقائية.
function ledgerSync(){
 if(!S) return;
 S.ownerTx=S.ownerTx||[];
 const byB={}; S.ownerTx.forEach(t=>{ if(t.auto&&t.bookingId) (byB[t.bookingId]=byB[t.bookingId]||[]).push(t); });
 const add=[], del={};
 S.bookings.forEach(function(b){
  if(!inLedger(b)||b.status==='ملغي') return;
  const u=unitById(b.unitId); if(!u||n(u.myOwnPct)>=1) return;
  const done=!!(((S.transfers||{})[b.id]||{}).owner), t=byB[b.id];
  if(done&&!t){
   const r=R(b); let kind='pay', amt=r.ownerNet;
   if(cashBy(b)==='owner'){ kind='recv'; amt=Math.max(0,cashTaken(b,u)-r.ownerNet); }
   amt=Math.round(amt*100)/100;
   if(amt<=EPS) return;
   // الحجز اللي يمتد على شهرين ينقسم على أشهر لياليه — والهللات الزايدة على آخر شهر
   const al=allocOf(b); let left=amt;
   al.forEach(function(a,i){ const v=i===al.length-1?Math.round(left*100)/100:Math.round(amt*a.f*100)/100; left-=v;
    if(v>EPS) add.push({id:uid(),unitId:b.unitId,kind:kind,amount:v,date:today(),period:a.m,bookingId:b.id,auto:true,ref:'',
     note:(kind==='pay'?'نصيب حجز ':'فرق كاش حجز ')+b.checkin+(b.ref?' #'+b.ref:'')+(al.length>1?' ('+a.nt+' من '+nights(b)+' ليالي)':'')}); });
  } else if(!done&&t){ t.forEach(x=>{ del[x.id]=1; }); }
 });
 if(add.length||Object.keys(del).length) S.ownerTx=S.ownerTx.filter(t=>!del[t.id]).concat(add);
}
function ledgerTxIn(uid2,fromM,toM){
 const LF=ledgerFrom();
 return (S.ownerTx||[]).filter(t=>t.unitId===uid2&&t.kind!=='opening'&&t.period&&t.period>=LF&&
   (!fromM||t.period>=fromM)&&(!toM||t.period<=toM));
}
// الأشهر اللي فيها نشاط لوحدة معيّنة (حجوزات/مصروفات/تعويضات/حركات)
function unitMonths(uid2){
 const m={};
 S.bookings.forEach(b=>{ if(b.unitId===uid2&&b.checkin&&b.status!=='ملغي') allocOf(b).forEach(a=>{ m[a.m]=1; }); });
 S.expenses.forEach(e=>{ if(e.unitId===uid2&&e.date) m[monthOf(e.date)]=1; });
 (S.claims||[]).forEach(c=>{ if(c.unitId===uid2&&c.date) m[monthOf(c.date)]=1; });
 (S.ownerTx||[]).forEach(t=>{ if(t.unitId===uid2&&t.period&&t.kind!=='opening') m[t.period]=1; });
 return Object.keys(m).sort();
}
// المتبقي للمالك عن الأشهر قبل الدفتر — بنفس منطق تقرير المالك (علامات التحويل)
function legacyRemain(uid2){
 const LF=ledgerFrom();
 return unitMonths(uid2).filter(m=>m<LF).reduce((a,m)=>a+stmtDataFor(uid2,m+'-01',lastDay(m)).remain,0);
}
// نفس الشي لكن حسب «المدفوع» اللي كان ينكتب باليد في كشف الملاك — للمقارنة فقط
function legacyRemainManual(uid2){
 const LF=ledgerFrom();
 return unitMonths(uid2).filter(m=>m<LF).reduce(function(a,m){
  const D=stmtDataFor(uid2,m+'-01',lastDay(m)); return a+D.due2-n(S.payouts[uid2+'|'+m])-D.cashNet; },0);
}
function openingOf(uid2){
 const L=(S.ownerTx||[]).filter(t=>t.unitId===uid2&&t.kind==='opening');
 return L.length?{set:true,amt:L.reduce((a,t)=>a+n(t.amount),0),tx:L}:{set:false,amt:legacyRemain(uid2),tx:[]};
}
function ownerBalance(uid2){
 const LF=ledgerFrom(), op=openingOf(uid2);
 const months=unitMonths(uid2).filter(m=>m>=LF).map(function(m){ return {m:m,D:stmtDataFor(uid2,m+'-01',lastDay(m))}; });
 return {op:op, months:months, bal:op.amt+months.reduce((a,x)=>a+x.D.remain,0)};
}

function stmtDataLive(uid2,from,to){
 const u=unitById(uid2);
 const inR=d=>d&&(!from||d>=from)&&(!to||d<=to);
 const rows=liveB().filter(b=>b.unitId===uid2).map(function(b){ const a=fracIn(b,from,to);
   return a.f>0?{b:b,r:scaleR(R(b),a.f),f:a.f,ntIn:a.nt}:null; }).filter(Boolean)
  .sort((a,b)=>String(a.b.checkin).localeCompare(String(b.b.checkin)));
 const T=rows.reduce((a,x)=>({base:a.base+ownBase(x.r),mg:a.mg+x.r.mgmtFee,ded:a.ded+x.r.dedOwn,
  pt:a.pt+x.r.myOwn,own:a.own+x.r.ownerNet,nt:a.nt+x.ntIn}),{base:0,mg:0,ded:0,pt:0,own:0,nt:0});
 const exs=S.expenses.filter(e=>e.unitId===uid2&&inR(e.date)&&ownerCut(e,u)>0);
 const exT=exs.reduce((a,e)=>a+ownerCut(e,u),0), due=T.own-exT;
 const cls=(S.claims||[]).filter(c=>c.unitId===uid2&&c.status==='تم التحصيل'&&inR(c.date)&&claimOwnerCut(c,u)>0);
 const clT=cls.reduce((a,c)=>a+claimOwnerCut(c,u),0);
 const due2=due+clT;
 // الكاش اللي استلمه المالك من الضيوف — ولو رجّع لنا الفرق (خطوة «يحوّل لي المالك» معلّمة) يُحسب له
 const cashRows=rows.filter(x=>cashBy(x.b)==='owner');
 const cashT=cashRows.reduce((a,x)=>a+cashTaken(x.b,u)*x.f,0);
 const cashComm=cashRows.reduce((a,x)=>a+commDue(x.b)*x.f,0);
 // نصيب المالك من حجوزات الكاش نفسها — الفرق بينه وبين الكاش يُخصم من حوالته (مقاصّة)
 const cashOwn=cashRows.reduce((a,x)=>a+x.r.ownerNet,0);
 // ── قبل الدفتر: المدفوع من علامات التحويل (الطريقة القديمة بدون تغيير) ──
 const legRows=rows.filter(x=>!inLedger(x.b));
 const cashBackLeg=legRows.filter(x=>cashBy(x.b)==='owner'&&isDone(x.b,'owner'))
   .reduce((a,x)=>a+Math.max(0,cashTaken(x.b,u)-x.r.ownerNet),0);
 const trfRows=legRows.filter(x=>cashBy(x.b)!=='owner');
 const trfDone=trfRows.filter(x=>isDone(x.b,'owner'));
 const trfGross=trfDone.reduce((a,x)=>a+x.r.ownerNet,0);
 const partial=trfGross>EPS&&trfDone.length<trfRows.length;
 // المصروفات والتعويضات تُصفّى مع الحوالات — ولا ينزل المحوّل تحت الصفر لو المصروف أكبر من الحوالة
 const trfLeg=trfGross>EPS?Math.max(0,trfGross-exT+clT):0;
 // ── من بداية الدفتر: حركات فعلية بمبالغ ثابتة ──
 const TX=ledgerTxIn(uid2,from?monthOf(from):'',to?monthOf(to):'');
 const pay=TX.filter(t=>t.kind==='pay').reduce((a,t)=>a+n(t.amount),0);
 const recv=TX.filter(t=>t.kind==='recv').reduce((a,t)=>a+n(t.amount),0);
 const adj=TX.filter(t=>t.kind==='adjust').reduce((a,t)=>a+n(t.amount),0);
 const cashBack=cashBackLeg+recv;
 const cashNet=cashT-cashBack;
 const trf=trfLeg+pay;
 const settled=trf>EPS;
 const dueT=due2+adj;
 const remain=dueT-trf-cashNet;
 return {u,from,to,rows,T,exs,exT,cls,clT,due,due2,adj,dueT,cashT,cashComm,cashOwn,cashBack,cashNet,
   trfGross,trfN:trfDone.length,trfOf:trfRows.length,settled,partial,trf,pay,recv,TX,remain};
}

/* ══════════════════════ إقفال الأشهر (Period Close) ══════════════════════
عند الإقفال ننسخ أرقام «المستحق» لكل مالك في ذاك الشهر. بعدها:
 • كشف الشهر المقفل يعرض المستحق من النسخة — ما يتغيّر لو تغيّرت الحسابات (المدفوع والكاش المرجّع يبقى حي).
 • أي تعديل مالي على حجز/مصروف/مطالبة/سحبة في شهر مقفل يُرفض (يُرجَع) — والملاحظات والحالة تقدر تعدلها.
 • لو تغيّرت الحسابات بعد الإقفال (مثلاً نسب الوحدة) يظهر «فرق بعد الإقفال» وتقدر ترحّله كتسوية للشهر المفتوح. */
const isClosedM=m=>!!(S&&S.closes&&S.closes[m]);
function snapFields(D){
 const r=v=>Math.round(n(v)*10000)/10000;
 return {T:{base:r(D.T.base),mg:r(D.T.mg),ded:r(D.T.ded),pt:r(D.T.pt),own:r(D.T.own),nt:D.T.nt},
  exT:r(D.exT),clT:r(D.clT),due:r(D.due),due2:r(D.due2),adj:r(D.adj),dueT:r(D.dueT),cashT:r(D.cashT),cashComm:r(D.cashComm),
  n:D.rows.length,posted:0};
}
const ZERO_SNAP={T:{base:0,mg:0,ded:0,pt:0,own:0,nt:0},exT:0,clT:0,due:0,due2:0,adj:0,dueT:0,cashT:0,cashComm:0,n:0,posted:0};
function stmtDataFor(uid2,from,to){
 const D=stmtDataLive(uid2,from,to);
 const m=from?monthOf(from):'';
 if(!m||monthOf(to||'')!==m||from!==m+'-01'||to!==lastDay(m)||!isClosedM(m)) return D;
 const c=S.closes[m], sn=(c.units&&c.units[uid2])||ZERO_SNAP, liveDue=D.dueT;
 Object.assign(D,{T:sn.T,exT:sn.exT,clT:sn.clT,due:sn.due,due2:sn.due2,adj:sn.adj,dueT:sn.dueT,cashT:sn.cashT,cashComm:sn.cashComm});
 D.cashNet=D.cashT-D.cashBack;
 D.remain=D.dueT-D.trf-D.cashNet;
 const drift=liveDue-sn.dueT-n(sn.posted);
 D.closed={m:m,at:c.at,by:c.by,drift:Math.abs(drift)>.005?drift:0};
 return D;
}
function closeMonth(m){
 S.closes=S.closes||{};
 const units={};
 S.units.forEach(function(u){ const D=stmtDataLive(u.id,m+'-01',lastDay(m));
  if(D.rows.length||D.exs.length||D.cls.length||Math.abs(D.adj)>EPS) units[u.id]=snapFields(D); });
 S.closes[m]={at:Date.now(),by:(cloudUser&&cloudUser.email)||'',units:units};
}
const FINB=['unitId','checkin','checkout','gross','commission','commVat','autoNet','net','fx','clean','laundry','platform','cashBy'];
const FINE=['unitId','date','amount','chargeTo'];
const FINC=['unitId','date','amount','to','status','platform'];
// مقارنة القيم المالية بمعناها لا بشكلها: نافذة التعديل تعيد كتابة كل الحقول
// (فاضي/غير موجود، "159.42"/159.42، commVat غير محدد/false) — بدون هذا يُرفض تغيير الحالة في شهر مقفل
const FIN_NUM={gross:1,commission:1,net:1,fx:1,clean:1,laundry:1,amount:1};
function finNorm(f,v){
 if(f==='commVat'||f==='autoNet') return v===true?'1':'0';
 if(v===undefined||v===null||v==='') return '';
 if(FIN_NUM[f]){ const x=Number(v); return isNaN(x)?String(v):String(Math.round(x*100)/100); }
 return String(v);
}
// يرجّع رسالة لو التعديل الأخير مسّ أرقام شهر مقفل
function closeViolation(){
 if(!S.closes||!Object.keys(S.closes).length||_auditBase==null) return '';
 let prev; try{ prev=JSON.parse(_auditBase); }catch(e){ return ''; }
 const bad=[];
 const chk=function(A,B,dateK,F,extra){
  const ms=x=>dateK==='checkin'?allocOf(x).map(a=>a.m).concat([monthOf(x.checkin)]):[monthOf(x[dateK])];
  const hit=x=>ms(x).forEach(m=>{ if(isClosedM(m)) bad.push(m); });
  const pa={}; (A||[]).forEach(x=>{ if(x&&x.id) pa[x.id]=x; }); const pb={}; (B||[]).forEach(x=>{ if(x&&x.id) pb[x.id]=x; });
  (B||[]).forEach(function(x){ const o=pa[x.id];
   if(!o){ hit(x); return; }
   const ch=F.some(f=>finNorm(f,o[f])!==finNorm(f,x[f]))||(extra&&extra(o,x));
   if(ch){ hit(o); hit(x); }
  });
  (A||[]).forEach(o=>{ if(!pb[o.id]) hit(o); });
 };
 chk(prev.bookings,S.bookings,'checkin',FINB,(o,x)=>(o.status==='ملغي')!==(x.status==='ملغي'));
 chk(prev.expenses,S.expenses,'date',FINE);
 chk(prev.claims,S.claims,'date',FINC);
 // السحبات تأثر على فرق العملة لكل حجوزات فترتها
 const pbt={}; (prev.batches||[]).forEach(x=>pbt[x.id]=x); const cbt={}; (S.batches||[]).forEach(x=>cbt[x.id]=x);
 const span=x=>{ const out=[]; if(!x||!x.from||!x.to) return out; let m=monthOf(x.from); const e=monthOf(x.to);
  while(m&&m<=e){ out.push(m); const d=new Date(+m.slice(0,4),+m.slice(5,7),1); m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); } return out; };
 Object.keys(Object.assign({},pbt,cbt)).forEach(function(id){ const o=pbt[id], x=cbt[id];
  if(JSON.stringify(o)===JSON.stringify(x)) return;
  span(o).concat(span(x)).forEach(m=>{ if(isClosedM(m)) bad.push(m); }); });
 // تسويات بتاريخ شهر مقفل
 chk((prev.ownerTx||[]).filter(t=>t.kind==='adjust'),(S.ownerTx||[]).filter(t=>t.kind==='adjust'),'period',['amount','unitId','period']);
 // اتفاقات الشركاء: أي تغيير في الاتفاقات السارية خلال شهر مقفل (نسبة، أساس، إضافة، حذف، تواريخ) مرفوض
 const sig=(st,u,m)=>JSON.stringify(agrFor(u,m,st).map(g=>[g.partnerId,g.base,n(g.pct),n(g.fixed),g.fixedPer,n(g.expPct)]).sort());
 const uids={}; (prev.units||[]).concat(S.units||[]).forEach(u=>{ if(u&&u.id) uids[u.id]=1; });
 agrsOf(prev).concat(agrsOf(S)).forEach(g=>{ if(g&&g.unitId) uids[g.unitId]=1; });
 if(JSON.stringify(agrsOf(prev))!==JSON.stringify(agrsOf(S)))
  Object.keys(S.closes).forEach(m=>{ Object.keys(uids).forEach(u=>{ if(sig(prev,u,m)!==sig(S,u,m)) bad.push(m); }); });
 if(!bad.length) return '';
 return 'شهر '+mLabel(bad[0])+' مقفل — التعديل ما انحفظ. افتح الشهر من «كشف الملاك»، أو سجّل الفرق كتسوية في شهر مفتوح.';
}

const HALALA=.015; // فروق تقريب أقل من هللة ما تُعرض كمتبقي
const SR=(v,d)=>'<span class="num">'+fmt(v,d==null?2:d)+'</span> <span class="cur">ر.س</span>';
const SNEG=(v,d)=>'<span class="num neg">−'+fmt(Math.abs(v),d==null?2:d)+'</span> <span class="cur">ر.س</span>';

function stmtSummary(D){
 // كل سطر: [عنوان (نص عادي)، ملاحظة صغيرة (نص عادي)، القيمة (HTML جاهز)، الصنف]
 const SPOS=v=>'<span class="num pos">+'+fmt(v,2)+'</span> <span class="cur">ر.س</span>';
 const row=x=>'<tr'+(x[3]?' class="'+x[3]+'"':'')+'><td>'+E(x[0])+
   (x[1]?'<div class="subnote">'+E(x[1])+'</div>':'')+'</td><td class="v">'+x[2]+'</td></tr>';
 // ① حساب المستحق — السطور تجمع للإجمالي بالضبط
 const A=[];
 A.push(['إجمالي الدخل المحصّل من المنصات','',SR(D.T.base),'']);
 if(D.T.mg>EPS) A.push(['رسوم الإدارة','',SNEG(D.T.mg),'neg']);
 if(D.T.ded>EPS) A.push(['نظافة ومغسلة وصيانة ومستلزمات','',SNEG(D.T.ded),'neg']);
 if(D.T.pt>EPS) A.push(['حصة الشريك من الأرباح','',SNEG(D.T.pt),'neg']);
 if(D.exT>EPS) A.push(['مصروفات دُفعت على حسابك','',SNEG(D.exT),'neg']);
 if(D.clT>EPS) A.push(['تعويضات محصّلة لصالحك','',SPOS(D.clT),'pos']);
 if(Math.abs(D.adj||0)>EPS) A.push(['تسويات',(D.TX||[]).filter(t=>t.kind==='adjust').map(t=>t.note||'').filter(Boolean).join(' · '),
   D.adj>0?SPOS(D.adj):SNEG(-D.adj),D.adj>0?'pos':'neg']);
 // ② التسوية (مقاصّة) — الكاش اللي عند المالك يُخصم من حوالته بدل ما يرجّع الفرق ونحوّل له كامل
 const B=[];
 const paidNet=D.trf-D.cashBack;      // صافي ما تحرّك فعلاً (حوالاتنا − ما رجّعه)
 let net=D.dueT-D.cashT;              // المبلغ النهائي بعد خصم الكاش
 if(Math.abs(net-paidNet)<HALALA) net=paidNet; // فرق تقريب هللة — لا نعرض رقمين مختلفين
 const remain=Math.abs(D.remain)<HALALA?0:D.remain;
 if(D.cashT>EPS){
  const own=n(D.cashOwn), diff=D.cashT-own;
  B.push(['مبالغ استلمتها كاش من الضيوف',
   'نصيبك منها '+fmt(own,2)+' ر.س'+
   (diff>EPS?' · الفرق '+fmt(diff,2)+' ر.س (رسوم الإدارة'+(D.cashComm>EPS?' وعمولة المنصة':'')+') يُخصم من حوالتك بدل ما ترجّعه':''),
   SNEG(D.cashT),'neg']);
  B.push([net<-EPS?'المبلغ النهائي المستحق علينا منك':'المبلغ النهائي اللي يوصلك',
   'صافي المستحق '+fmt(D.dueT,2)+' − الكاش اللي عندك '+fmt(D.cashT,2),
   SR(Math.abs(net)),'tot']);
 }
 if(paidNet>EPS) B.push(['حُوّل لك فعلياً',
   (D.pay>EPS&&D.cashBack<=EPS?(D.TX.filter(t=>t.kind==='pay').length)+' حوالة مسجّلة · ':'')+
   (D.partial?D.trfN+' من '+D.trfOf+' حجز محوَّل · ':'')+
   (D.cashBack>EPS?'حوالة صافية: نصيبك '+fmt(D.trf,2)+' − فرق الكاش '+fmt(D.cashBack,2)+' · ':'')+
   ((D.exT>EPS||D.clT>EPS)?'نصيبك من الحجوزات المحوَّلة '+fmt(D.trfGross,2)+
     (D.exT>EPS?' − مصروفات '+fmt(D.exT,2):'')+(D.clT>EPS?' + تعويضات '+fmt(D.clT,2):''):''),
   SNEG(paidNet),'paid']);
 else if(paidNet<-EPS) B.push(['رجّعته لنا','',SPOS(-paidNet),'pos']);
 const rem=Math.abs(remain)>EPS
  ?'<tr class="rem"><td>'+(remain<-EPS?'<b>مستحق علينا منك</b>'+
      '<div class="subnote">استلمت كاش أكثر من نصيبك — الفرق يُرجَّع للإدارة</div>':'المتبقي لك')+
    '</td><td class="v"><span class="num"'+(remain<-EPS?' style="color:var(--clay)"':'')+'>'+
    fmt(Math.abs(remain),2)+'</span> <span class="cur">ر.س</span></td></tr>'
  :(B.length?'<tr class="rem"><td>المتبقي لك</td><td class="v"><span class="num pos">0.00</span> <span class="cur">ر.س</span> <span class="cur">— مسدّد بالكامل</span></td></tr>':'');
 return '<table class="sum"><tbody>'+A.map(row).join('')+
  '<tr class="tot"><td>صافي المستحق لك</td><td class="v">'+SR(D.dueT)+'</td></tr>'+
  B.map(row).join('')+rem+'</tbody></table>';
}

function closeCard(){
 const cur=today().slice(0,7), cl=S.closes||{};
 const all={}; S.bookings.forEach(b=>{ allocOf(b).forEach(a=>{ all[a.m]=1; }); });
 S.expenses.forEach(e=>{ if(e.date) all[monthOf(e.date)]=1; });
 const open=Object.keys(all).filter(m=>m<cur&&!cl[m]).sort();
 const closed=Object.keys(cl).sort();
 // نسمح بإقفال الأشهر بالترتيب: أقدم شهر مفتوح أولاً — وما نسمح بفتح إلا آخر شهر مقفل
 const next=open[0], last=closed[closed.length-1];
 const drifts=[]; closed.forEach(m=>S.units.forEach(u=>{ const D=stmtDataFor(u.id,m+'-01',lastDay(m));
   if(D.closed&&D.closed.drift) drifts.push({m:m,u:u,d:D.closed.drift}); }));
 return '<div class="card pad" style="margin-bottom:13px">'+
  '<div style="display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap">'+
  '<div><p class="h3" style="margin:0 0 4px">إقفال الأشهر</p>'+
  '<div style="font-size:12px;color:var(--muted)">'+(closed.length?'مقفل حتى <b>'+E(mLabel(last))+'</b> ('+closed.length+' شهر)':'ما فيه أشهر مقفلة بعد')+'</div></div>'+
  '<div style="display:flex;gap:7px;flex-wrap:wrap">'+
  (next?'<button class="btn btn-p" style="padding:7px 12px;font-size:12.5px" data-act="closeMon" data-m="'+next+'">🔒 اقفل '+E(mLabel(next))+'</button>':'')+
  (last?'<button class="btn btn-g" style="padding:7px 12px;font-size:12.5px" data-act="reopenMon" data-m="'+last+'">افتح '+E(mLabel(last))+'</button>':'')+
  '</div></div>'+
  (drifts.length?'<div class="warn" style="margin-top:11px">⚠ تغيّرت الحسابات بعد الإقفال: '+
   drifts.map(x=>E((x.u.owner||x.u.name)+' — '+mLabel(x.m))+' <b class="num">'+(x.d>0?'+':'')+fmt(x.d,2)+'</b> '+
    '<button class="btn btn-g" style="padding:3px 9px;font-size:11.5px" data-act="postDrift" data-m="'+x.m+'" data-u="'+E(x.u.id)+'">رحّله كتسوية</button>').join(' · ')+
   '<div style="font-size:11.5px;margin-top:5px">الكشف المقفل يبقى على أرقامه. الترحيل يضيف الفرق كتسوية في دفتر المالك للشهر الحالي.</div></div>':'')+
  '<div style="font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.8">الشهر المقفل: كشفه ثابت، وما ينقبل أي تعديل مالي على حجوزاته أو مصروفاته (الملاحظات والحالة عادي). '+
  'التحويلات والكاش المرجّع تقدر تسجلها في أي وقت.</div></div>';
}

function drCal(from,to,ym){
 const nd=daysIn(ym), lead=new Date(+ym.split('-')[0],+ym.split('-')[1]-1,1).getDay();

  '<button type="button" class="ico" data-act="mShift" data-d="-1">‹</button>'+

  '<button type="button" class="ico" data-act="mShift" data-d="1">›</button></div><div class="dg">';
 h+=WD.map(d=>'<div class="wd">'+d+'</div>').join('');
 for(let i=0;i<lead;i++) h+='<div></div>';
 for(let d=1;d<=nd;d++){
  const iso=ym+'-'+String(d).padStart(2,'0');
  const edge=iso===from||iso===to, ins=from&&to&&iso>from&&iso<to;
  h+='<button type="button" class="dc'+(edge?' edge':'')+(ins?' in':'')+'" data-act="pickD" data-d="'+iso+'">'+d+'</button>';

  (from&&!to?'اختر يوم الخروج':'اختر يوم الدخول ثم يوم الخروج')+'</div>';
 return h;
}

// اختيار شهر بقائمتين (الشهر + السنة) — يشتغل نفس الشي على كل الأجهزة، والسنوات لين 6 سنين قدام
function monthPick(key,val,emptyLabel){
 const cur=+today().slice(0,4), v=String(val||''), vy=v?+v.slice(0,4):0, vm=v?v.slice(5,7):'';
 let y0=2024; (S.bookings||[]).forEach(b=>{ const y=+String(b.checkin||'').slice(0,4); if(y&&y<y0) y0=y; }); if(vy&&vy<y0) y0=vy;
 const y1=Math.max(cur+6,vy||0), ys=[]; for(let y=y0;y<=y1;y++) ys.push(y);
 const st='style="flex:1;min-width:0"';
 return '<div style="display:flex;gap:6px">'+
  '<select data-gm="'+key+':m" '+st+'>'+(emptyLabel?'<option value=""'+(v?'':' selected')+'>'+E(emptyLabel)+'</option>':'')+
   MA.map((n_,i)=>{ const mm=String(i+1).padStart(2,'0'); return '<option value="'+mm+'"'+(mm===vm?' selected':'')+'>'+n_+'</option>'; }).join('')+'</select>'+
  '<select data-gm="'+key+':y" '+st+'>'+(emptyLabel?'<option value=""'+(v?'':' selected')+'>—</option>':'')+
   ys.map(y=>'<option value="'+y+'"'+(y===vy?' selected':'')+'>'+y+'</option>').join('')+'</select></div>';
}

// نص الرسالة يُبنى من نفس بيانات الكشف (stmtData) — فالرقم في الرسالة = الرقم في الـPDF دائماً
function repText(){
 const D=stmtData(), u=D.u;
 if(!u) return '';
 const R2=v=>fmt(v,2)+' ر.س';
 const L=['كشف حساب — '+u.name,'المالك: '+(u.owner||'—'),'الفترة: '+D.from+' إلى '+D.to,'',
  'عدد الحجوزات: '+D.rows.length+' · الليالي: '+D.T.nt,
  'إجمالي الدخل المحصّل: '+R2(D.T.base)];
 if(D.T.mg>EPS) L.push('رسوم الإدارة: −'+R2(D.T.mg));
 if(D.T.ded>EPS) L.push('نظافة ومغسلة وصيانة ومستلزمات: −'+R2(D.T.ded));
 if(D.T.pt>EPS) L.push('حصة الشريك: −'+R2(D.T.pt));
 if(D.exT>EPS) L.push('مصروفات دُفعت على حسابك: −'+R2(D.exT));
 if(D.clT>EPS) L.push('تعويضات محصّلة لك: +'+R2(D.clT));
 if(Math.abs(D.adj||0)>EPS) L.push('تسويات: '+(D.adj>0?'+':'−')+R2(Math.abs(D.adj)));
 L.push('———————————','صافي المستحق لك: '+R2(D.dueT));
 const paidNet=D.trf-D.cashBack; let net=D.dueT-D.cashT;
 if(Math.abs(net-paidNet)<HALALA) net=paidNet;
 const remain=Math.abs(D.remain)<HALALA?0:D.remain;
 if(D.cashT>EPS){
  const diff=D.cashT-n(D.cashOwn);
  L.push('استلمته كاش من الضيوف: −'+R2(D.cashT)+' (نصيبك منه '+R2(n(D.cashOwn))+')');
  if(diff>EPS) L.push('فرق الكاش '+R2(diff)+' يُخصم من حوالتك بدل ما ترجّعه');
  L.push((net<-EPS?'المبلغ النهائي المستحق علينا منك: ':'المبلغ النهائي اللي يوصلك: ')+R2(Math.abs(net)));
 }
 if(paidNet>EPS) L.push('حُوّل لك فعلياً: −'+R2(paidNet)+(D.partial?' ('+D.trfN+' من '+D.trfOf+' حجز)':''));
 else if(paidNet<-EPS) L.push('رجّعته لنا: +'+R2(-paidNet));
 if(Math.abs(remain)>EPS) L.push((remain<0?'مستحق علينا منك: ':'المتبقي لك: ')+R2(Math.abs(remain)));
 else if(D.settled||D.cashT>EPS) L.push('المتبقي لك: 0.00 ر.س — مسدّد بالكامل');
 return L.join('\n');
}

/* ══════════════════════ audit trail — سجل التعديلات ══════════════════════
كل حفظ (commit) نقارن الحالة الجديدة بآخر حالة معروفة، ونسجّل الفرق: إضافة/تعديل/حذف مع القيم قبل وبعد.
السجل ينحفظ في Firestore بمستند لكل شهر (audit-YYYY-MM) — منفصل عن البيانات فما يكبّرها.
لو الجهاز أوفلاين، تنتظر الحركات في طابور محلي وتنرفع أول ما يتصل. */
const AUD_COLLS={bookings:'حجز',units:'وحدة',expenses:'مصروف',claims:'مطالبة',batches:'سحبة PayPal',
 ownerTx:'حركة مالك',recurring:'مصروف متكرر',partners:'شريك',pagr:'اتفاق شريك',contracts:'عقد شهري'};
const AUD_MAPS={transfers:'علامات التحويل',payouts:'مدفوع يدوي للمالك',commPaid:'دفع العمولات',target:'ربح مستهدف',
 comm:'نسب العمولة',mohPaid:'مدفوع لمحمد (قديم)',closes:'إقفال الأشهر'};
let AUD_Q=LS+'.auditq';
let _auditBase=null;
function auditReset(){ try{ _auditBase=JSON.stringify(S); }catch(e){ _auditBase=null; } }
function auditDiff(prev,cur){
 const out=[];
 Object.keys(AUD_COLLS).forEach(function(k){
  const A=(prev&&prev[k])||[], B=(cur&&cur[k])||[];
  const ma={}; A.forEach(x=>{ if(x&&x.id) ma[x.id]=x; });
  const mb={}; B.forEach(x=>{ if(x&&x.id) mb[x.id]=x; });
  B.forEach(function(x){ if(!x||!x.id) return; const o=ma[x.id];
   if(!o){ out.push({op:'add',coll:k,id:x.id,after:x}); return; }
   const ch={}; let any=false;
   Object.keys(Object.assign({},o,x)).forEach(function(f){
    if(JSON.stringify(o[f])!==JSON.stringify(x[f])){ ch[f]=[o[f]===undefined?null:o[f], x[f]===undefined?null:x[f]]; any=true; } });
   if(any) out.push({op:'edit',coll:k,id:x.id,changes:ch,ref:auditRef(k,x)});
  });
  A.forEach(function(x){ if(x&&x.id&&!mb[x.id]) out.push({op:'delete',coll:k,id:x.id,before:x}); });
 });
 Object.keys(AUD_MAPS).forEach(function(k){
  const A=(prev&&prev[k])||{}, B=(cur&&cur[k])||{};
  Object.keys(Object.assign({},A,B)).forEach(function(key){
   if(JSON.stringify(A[key])!==JSON.stringify(B[key]))
    out.push({op:'set',coll:k,id:key,changes:{v:[A[key]===undefined?null:A[key], B[key]===undefined?null:B[key]]}});
  });
 });
 return out;
}
// وصف مختصر يساعد في القراءة لاحقاً (الوحدة والتاريخ) — حتى لو انحذف العنصر
function auditRef(k,x){
 if(!x) return '';
 const u=x.unitId&&unitById(x.unitId);
 if(k==='bookings') return (u?u.name:'')+' · '+(x.checkin||'')+' · '+(x.platform||'')+(x.ref?' #'+x.ref:'');
 if(k==='units') return x.name||'';
 if(k==='expenses'||k==='claims') return (u?u.name:'')+' · '+(x.date||'')+' · '+(x.amount||'');
 if(k==='ownerTx') return (u?u.name:'')+' · '+(x.date||'')+' · '+(x.amount||'');
 return '';
}
function auditLogRaw(entries){
 if(!entries||!entries.length) return;
 const who=(cloudUser&&cloudUser.email)||'جهاز غير مسجّل', ts=Date.now();
 entries.forEach(function(e){ e.ts=ts; e.by=who; if(!e.ref) e.ref=auditRef(e.coll,e.after||e.before); });
 let q=[]; try{ q=JSON.parse(localStorage.getItem(AUD_Q)||'[]')||[]; }catch(e){}
 q=q.concat(entries);
 try{ localStorage.setItem(AUD_Q,JSON.stringify(q)); }catch(e){}
 auditFlush();
}
function auditCommit(){
 if(_auditBase==null){ auditReset(); return; }
 let prev=null; try{ prev=JSON.parse(_auditBase); }catch(e){}
 const e=auditDiff(prev,S);
 auditReset();
 auditLogRaw(e);
}
let _auditFlushing=false;
function auditFlush(){
 if(!CLOUD_ENABLED||!cloudDoc||_auditFlushing||typeof firebase==='undefined') return;
 let q=[]; try{ q=JSON.parse(localStorage.getItem(AUD_Q)||'[]')||[]; }catch(e){}
 if(!q.length) return;
 // نجمّع حسب شهر الحركة — مستند لكل شهر
 const byM={}; q.forEach(function(e){ const d=new Date(e.ts); const m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); (byM[m]=byM[m]||[]).push(e); });
 _auditFlushing=true;
 const FV=firebase.firestore.FieldValue;
 Promise.all(Object.keys(byM).map(function(m){
  return qcol().doc('audit-'+m)
   .set({entries:FV.arrayUnion.apply(FV,byM[m]),updated:Date.now()},{merge:true});
 })).then(function(){
  // نشيل اللي انرفع بس — أي حركة جت أثناء الرفع تبقى للمرة الجاية
  let now=[]; try{ now=JSON.parse(localStorage.getItem(AUD_Q)||'[]')||[]; }catch(e){}
  try{ localStorage.setItem(AUD_Q,JSON.stringify(now.slice(q.length))); }catch(e){}
 }).catch(function(e){ console.error('audit flush',e); })
 .then(function(){ _auditFlushing=false; });
}
function auditLoad(months){
 if(!cloudDoc){ ui.logErr='سجّل دخول عشان تشوف السجل.'; render(); return; }
 ui.logBusy=true; render();
 Promise.all(months.map(function(m){ return qcol().doc('audit-'+m).get(); }))
  .then(function(docs){
   let all=[]; docs.forEach(function(d){ if(d.exists) all=all.concat(d.data().entries||[]); });
   let q=[]; try{ q=JSON.parse(localStorage.getItem(AUD_Q)||'[]')||[]; }catch(e){}
   all=all.concat(q.map(function(e){ return Object.assign({pending:true},e); }));
   all.sort(function(a,b){ return b.ts-a.ts; });
   ui.logData=all; ui.logBusy=false; ui.logErr=''; render();
  }).catch(function(e){ ui.logBusy=false; ui.logErr='ما قدرت أقرأ السجل: '+(e.code||e.message); render(); });
}


/* ══════════════════════ المؤشرات (KPIs) ══════════════════════
مؤشرات تشغيلية بمعايير الفنادق — كل الحجوزات تتوزع هنا على لياليها الفعلية (بغض النظر عن تاريخ الدفتر)
لأنها قياس أداء مو كشف مالي. الإيراد = صافي التحويل + فرق العملة (بعد عمولة المنصة). */
function nightsIn(b,from,to){
 const nt=nights(b); if(!b.checkin||nt<=0||b.cxFee) return 0;
 let c=0; for(let i=0;i<nt;i++){ const d=addD(b.checkin,i); if(d>=from&&d<=to) c++; } return c;
}
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1; }
// فترة نشاط الوحدة: من أول حجز — ولو مؤرشفة لين آخر خروج
function unitWindow(u){
 const L=S.bookings.filter(b=>b.unitId===u.id&&b.status!=='ملغي'&&b.checkin);
 if(!L.length) return null;
 const first=L.map(b=>b.checkin).sort()[0];
 const last=u.archived?addD(L.map(b=>b.checkout||b.checkin).sort().pop(),-1):'9999-12-31';
 return {from:first,to:last};
}
function kpiFor(units,from,to){
 let AN=0,SN=0,REV=0,COST=0,BK=0,CX=0,ALLB=0;
 const ch={};
 units.forEach(function(u){
  const w=unitWindow(u); if(!w) return;
  const a=from>w.from?from:w.from, z=to<w.to?to:w.to;
  if(a<=z) AN+=Math.max(1,n(u.rooms))*daysBetween(a,z);
  S.bookings.filter(b=>b.unitId===u.id&&b.platform!=='شهري').forEach(function(b){
   const ni=nightsIn(b,from,to);
   if(b.checkin>=from&&b.checkin<=to){ ALLB++; if(b.status==='ملغي') CX++; }
   if(b.status==='ملغي'||!ni) return;
   const f=ni/Math.max(1,nights(b)), r=R(b);
   SN+=ni; REV+=r.base*f; COST+=r.costs*f;
   if(b.checkin>=from&&b.checkin<=to) BK++;
   const p=b.platform||'أخرى'; const c=ch[p]=ch[p]||{sn:0,rev:0,bk:0,gross:0,comm:0};
   c.sn+=ni; c.rev+=r.base*f; if(b.checkin>=from&&b.checkin<=to) c.bk++;
   if(n(b.gross)>0&&commDue(b)>0){ c.gross+=n(b.gross)*f; c.comm+=commDue(b)*f; }
  });
  COST+=S.expenses.filter(e=>e.unitId===u.id&&e.date>=from&&e.date<=to).reduce((a,e)=>a+n(e.amount),0);
 });
 return {AN,SN,REV,COST,BK,CX,ALLB,ch,
  occ:AN?SN/AN:0, adr:SN?REV/SN:0, revpar:AN?REV/AN:0, alos:BK?SN/BK:0, cpor:SN?COST/SN:0, cxr:ALLB?CX/ALLB:0};
}
function kpiRange(k){
 const t=today(), cm=t.slice(0,7);
 const prevM=(m,i)=>{ const d=new Date(+m.slice(0,4),+m.slice(5,7)-1-i,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
 if(k==='cur') return {from:cm+'-01',to:lastDay(cm),l:'الشهر الحالي'};
 if(k==='3m') return {from:prevM(cm,3)+'-01',to:lastDay(prevM(cm,1)),l:'آخر 3 أشهر مكتملة'};
 if(k==='ytd') return {from:t.slice(0,4)+'-01-01',to:t,l:'من بداية السنة'};
 if(k==='12m') return {from:prevM(cm,12)+'-01',to:lastDay(prevM(cm,1)),l:'آخر 12 شهر'};
 const lm=prevM(cm,1); return {from:lm+'-01',to:lastDay(lm),l:mLabel(lm)};
}

 const kp='<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+K.map(x=>'<div class="kpi"><div class="lab">'+E(x[0])+'</div>'+

/* ── ربح كل وحدة (GOP) ──
الإيراد الصافي − تكاليف التشغيل المباشرة (نظافة/مغسلة/صيانة/مستلزمات) − المصاريف = الربح التشغيلي.
وينقسم: للمالك (نصيبه − مصاريف عليه) وللإدارة (أنا + الشركاء − مصاريف علينا). المجموع يطابق الربح بالضبط. */
function gopFor(u,from,to){
 let rev=0,dir=0,own=0,mgmt=0;
 S.bookings.forEach(function(b){ if(b.unitId!==u.id||b.status==='ملغي') return;
  const f=b.cxFee?((b.checkin>=from&&b.checkin<=to)?1:0):nightsIn(b,from,to)/Math.max(1,nights(b)); if(!f) return; const r=R(b);
  rev+=r.base*f; dir+=r.costs*f; own+=r.ownerNet*f; mgmt+=(r.myNet+r.moh)*f; });
 const ex=S.expenses.filter(e=>e.unitId===u.id&&e.date>=from&&e.date<=to);
 const exT=ex.reduce((a,e)=>a+n(e.amount),0);
 own-=ex.reduce((a,e)=>a+ownerCut(e,u),0); mgmt-=ex.reduce((a,e)=>a+myCut(e,u),0);
 const gop=rev-dir-exT;
 return {rev,dir,exT,gop,own,mgmt,mgn:rev?gop/rev:0};
}
function gopTable(units,from,to){
 const L=units.map(u=>({u:u,g:gopFor(u,from,to)})).filter(x=>x.g.rev||x.g.exT);
 if(!L.length) return '';
 const T=L.reduce((a,x)=>({rev:a.rev+x.g.rev,dir:a.dir+x.g.dir,exT:a.exT+x.g.exT,gop:a.gop+x.g.gop,own:a.own+x.g.own,mgmt:a.mgmt+x.g.mgmt}),{rev:0,dir:0,exT:0,gop:0,own:0,mgmt:0});
 const row=(name,g,b)=>'<tr'+(b?' style="font-weight:700;background:var(--paper)"':'')+'><td>'+name+'</td><td class="num">'+fmt(g.rev,0)+'</td>'+
  '<td class="num">'+(g.dir?'−'+fmt(g.dir,0):'—')+'</td><td class="num">'+(g.exT?'−'+fmt(g.exT,0):'—')+'</td>'+
  '<td class="num" style="font-weight:600;color:'+(g.gop<0?'var(--clay)':'inherit')+'">'+fmt(g.gop,0)+'</td>'+
  '<td class="num">'+(g.rev?((g.gop/g.rev)*100).toFixed(0)+'%':'—')+'</td>'+
  '<td class="num">'+fmt(g.own,0)+'</td><td class="num" style="color:'+C.my+'">'+fmt(g.mgmt,0)+'</td></tr>';
 const few=S.expenses.length<10;
 return '<div class="card" style="margin-bottom:12px"><div class="pad" style="padding-bottom:2px"><p class="h3">ربح كل وحدة (GOP)</p></div><div class="scroll"><table><thead><tr>'+
  '<th>الوحدة</th><th>صافي الإيراد</th><th>تشغيل مباشر</th><th>مصاريف</th><th>الربح التشغيلي</th><th>الهامش</th><th>للمالك</th><th>للإدارة (أنا+الشركاء)</th></tr></thead><tbody>'+
  L.map(x=>row('<b>'+E(x.u.name)+'</b>',x.g)).join('')+(L.length>1?row('الإجمالي',T,true):'')+'</tbody></table></div>'+
  (few?'<div class="pad" style="font-size:11.5px;color:var(--clay);padding-top:0">⚠ المصاريف المسجّلة قليلة ('+S.expenses.length+') — الربح هنا أعلى من الحقيقي لين تسجّل الكهرباء والإنترنت والاشتراكات (استخدم «المتكررة» في المصروفات).</div>':'')+'</div>';
}

function audVal(v){

 if(typeof v==='object') return Object.keys(v).filter(k=>v[k]).map(k=>k).join('، ')||'—';

// وحدات انحذفت وحجوزاتها باقية — نرجّعها «مؤرشفة» بإعداداتها الأصلية (من نسخة 2026-09-25)
// عشان حجوزاتها تنحسب بالقسمة الصحيحة بدل ما تنحسب كلها ربح للإدارة.
const RESTORE_UNITS={};   // أبحر هومز انحفظت في السحابة (2026-10-09) — ما عاد يلزم
// يشتغل على أي حالة (محلية أو قادمة من السحابة) — ما يلمس الحجوزات أبداً، يضيف الوحدات الناقصة فقط
function migrate(st){
 if(!st||!st.units) return st;
 try{ st.units.forEach(function(u){
  if(u.id==='u_homey' && /^أنا/.test(String(u.owner||''))) u.owner='عبدالعزيز';
  if(u.fxMode===undefined) u.fxMode = (u.fxAuto? 'shared':'off');   // ترحيل من fxAuto القديم
  if(u.suppliesPct===undefined){ u.suppliesPct=0; u.suppliesBy=u.maintBy||'owner'; }
 }); }catch(e){}
 try{
  const have={}; st.units.forEach(u=>have[u.id]=1);
  const refs={};
  (st.bookings||[]).forEach(b=>{ if(b.unitId&&!have[b.unitId]) refs[b.unitId]=1; });
  (st.expenses||[]).forEach(e=>{ if(e.unitId&&!have[e.unitId]) refs[e.unitId]=1; });
  (st.claims||[]).forEach(c=>{ if(c.unitId&&!have[c.unitId]) refs[c.unitId]=1; });
  Object.keys(refs).forEach(id=>{
   const src=RESTORE_UNITS[id]||SEED_UNITS.filter(u=>u.id===id)[0];
   const u=src?Object.assign({},src):Object.assign({},BLANK_U,{id:id,name:'وحدة محذوفة ('+id+')',
     mgmtPct:0,myOwnPct:1,notes:'رُجّعت تلقائياً لأن حجوزاتها باقية — عدّل نسبها من هنا.'});
   u.archived=true; st.units.push(u);
  });
 }catch(e){ console.error('migrate',e); }
 // الشركاء: أول مرة — محمد ينتقل من حقول الوحدة (mohPct/mohBase) إلى اتفاقات «من البداية» بنفس النسب بالضبط.
 // الحقول القديمة تبقى في الوحدة كما هي (مرجع فقط) — الحساب صار من الاتفاقات.
 try{
  if(!Array.isArray(st.partners)){
   st.partners=[]; st.pagr=Array.isArray(st.pagr)?st.pagr:[];
   const withMoh=st.units.filter(u=>n(u.mohPct)!==0);
   if(withMoh.length){
    st.partners.push({id:PT_LEGACY,name:'محمد',phone:'',note:''});
    withMoh.forEach(function(u){
     st.pagr.push({id:'ag_moh_'+u.id,partnerId:PT_LEGACY,unitId:u.id,base:u.mohBase==='mgmt'?'mgmt':'mynet',
      pct:n(u.mohPct),fixed:0,fixedPer:'booking',expPct:0,from:'',to:'',note:'منقول من إعدادات الوحدة القديمة'});
    });
   }
  }
  if(!Array.isArray(st.pagr)) st.pagr=[];
 }catch(e){ console.error('migrate partners',e); }
 return st;
}

/* ══════════════════════ boot ══════════════════════ */
S=load();
if(!S){ S=initial(); }
else { S=Object.assign(blank(),S); }
migrate(S);
auditReset();
try{ localStorage.setItem(LS,JSON.stringify(S)); saveSt='ok'; }
catch(e){ saveSt='fail'; }
render();
if(saveSt==='fail') toast('المتصفح ما يسمح بالحفظ هنا. ارفع الملف كموقع أو استخدم زر النسخة الاحتياطية.');
initCloud();
setTimeout(checkDailyBackup,4000);
setInterval(checkDailyBackup,5*60*1000);
